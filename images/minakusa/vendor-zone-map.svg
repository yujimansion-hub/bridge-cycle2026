<circle cx="111" cy="845" r="13" fill="#D25C28"/>
<text x="140" y="854" font-family="'Noto Sans CJK JP',sans-serif" font-size="22" font-weight="800" fill="#7D431F">概略図：実際の位置・形状・区画境界・利用可能時間は未確定です。正式案内が優先されます。</text>
