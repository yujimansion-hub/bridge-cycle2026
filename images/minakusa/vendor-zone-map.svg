<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="maptitle mapdesc">
<title id="maptitle">南草津駅前 出店候補エリア案内</title>
<desc id="mapdesc">JR南草津駅を中心に、西口の駅前広場、東口のバスのりば1・2前、3・4前、5・6前の4つの候補エリアを示す概略図。区画の正確な位置や大きさは未確定。</desc>
<defs>
 <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F8F0"/><stop offset="1" stop-color="#EBF5EF"/></linearGradient>
 <filter id="ds" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#12382D" flood-opacity=".10"/></filter>
</defs>
<rect width="1440" height="900" fill="url(#background)"/>
<text x="72" y="85" font-family="'Noto Sans CJK JP',sans-serif" font-size="44" font-weight="900" fill="#173F32">南草津駅前 ｜ 出店候補エリア</text>
<text x="72" y="130" font-family="'Noto Sans CJK JP',sans-serif" font-size="22" fill="#577365">位置関係をつかむための概略案内図</text>
<rect x="55" y="174" width="1330" height="615" rx="32" fill="#FFFFFF" filter="url(#ds)"/>
