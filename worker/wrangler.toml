name = "akinai-api"
main = "akinai-worker.js"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGIN = "https://yujimansion-hub.github.io"
OPENAI_MODEL = "gpt-5.6-luna"\nSITE_BASE = "https://yujimansion-hub.github.io/bridge-cycle2026"\nSTRIPE_PRICE_ID = "REPLACE_WITH_STRIPE_PRICE_ID"

# Create a KV namespace and replace the placeholder before deploy:
# npx wrangler kv namespace create AKINAI_KV
[[kv_namespaces]]
binding = "AKINAI_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (never commit values):
# npx wrangler secret put STRIPE_SECRET_KEY
# npx wrangler secret put OPENAI_API_KEY
# npx wrangler secret put TOKEN_SECRET
