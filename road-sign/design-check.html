<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>スマホ幅の表示確認｜ミツカルート</title><style>*{box-sizing:border-box}body{margin:0;background:#edf0e7;color:#181e1b;font:14px/1.6 system-ui,sans-serif}header{padding:20px 30px;border-bottom:1px solid #cdd7c2;background:#f5f6f1;display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:18px;margin:0}label{display:flex;align-items:center;gap:10px}select{font:inherit;padding:8px 12px;border:1px solid #b9c4b4;border-radius:6px;background:white}main{display:flex;align-items:start;justify-content:center;gap:28px;padding:25px;overflow:auto}figure{margin:0;flex:none}figcaption{padding-bottom:10px;font-weight:600}iframe{display:block;border:1px solid #c7d1bd;background:white;border-radius:10px;box-shadow:0 10px 30px #181e1b0d}a{color:inherit}</style></head><body>
<header><h1>ミツカルート｜表示確認</h1><label>ページ<select id="page"><option value="./">トップ</option><option value="kaiin.html">クリニック</option><option value="akiban.html">看板を探す</option><option value="maps.html">提案事例</option><option value="owner.html">場所を貸す</option><option value="partner.html">看板会社</option><option value="clinic.html">提案書の見本</option><option value="beauty-clinic.html">美容クリニック</option></select></label><a href="./">公開ページへ ↗</a></header>
<main><figure><figcaption>スマホ幅 390px</figcaption><iframe id="mobile" title="スマホ幅390pxの表示" src="./?internal=1" width="390" height="844"></iframe></figure><figure><figcaption>タブレット幅 768px</figcaption><iframe id="tablet" title="タブレット幅768pxの表示" src="./?internal=1" width="768" height="900"></iframe></figure></main>
<script>document.getElementById('page').addEventListener('change',function(){var paths=['./','kaiin.html','akiban.html','maps.html','owner.html','partner.html','clinic.html','beauty-clinic.html'];if(paths.indexOf(this.value)<0)return;var path=this.value+'?internal=1';document.getElementById('mobile').src=path;document.getElementById('tablet').src=path;});</script>
</body></html>
