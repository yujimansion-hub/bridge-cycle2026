<section id="experiment" style="max-width: 1120px; margin: 0 auto; padding: 40px 24px 0">
<div style="background: #FFFFFF; border: 1px solid #D9DED8; border-radius: 24px; padding: 24px 28px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">

<span><strong style="color: #1B2626">出店者の募集・調整：</strong>BRIDGE CYCLE株式会社</span>

<div style="max-width: 1120px; margin: 0 auto; padding: 32px 24px 48px"><details style="background: #FFFFFF; border: 1px solid #D9DED8; border-radius: 20px; padding: 4px 8px"><summary style="min-height: 64px; display: flex; align-items: center; padding-left: 12px; font-weight: 700; font-size: 17px; cursor: pointer">売り場ごとの客層・人の流れ・利益の計算を見る</summary>
<section id="calc" style="max-width: 1120px; margin: 0 auto; padding: 32px 24px 24px">
<details style="background: #FFFFFF; border: 1px solid #D9DED8; border-radius: 20px; padding: 4px 20px 16px">
<summary style="min-height: 72px; display: flex; flex-direction: column; justify-content: center; gap: 2px; cursor: pointer; padding: 8px 40px 8px 0"><span style="font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: 20px">1回いくら残るか、計算してみる</span><span style="font-size: 14px; color: #4A5856">5時間枠・客単価700円なら、設営と片付けの人件費まで入れて29人目から黒字です</span></summary>
<div style="display: flex; flex-wrap: wrap; gap: 20px; padding: 8px 0 12px">
<div style="flex: 999 1 440px; min-width: 0; background: #FFFFFF; border: 1px solid #D9DED8; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 2px">
<label for="calc-price" style="display: flex; justify-content: space-between; align-items: baseline; font-weight: 700"><span>客単価</span><span style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 26px">{{priceLabel}}<span style="font-size: 14px">円</span></span></label>
<input id="calc-price" type="range" min="300" max="2000" step="50" value="{{price}}" onChange="{{setPrice}}">
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<label for="calc-count" style="display: flex; justify-content: space-between; align-items: baseline; font-weight: 700"><span>来客数</span><span style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 26px">{{count}}<span style="font-size: 14px">人</span></span></label>
<input id="calc-count" type="range" min="5" max="150" step="5" value="{{count}}" onChange="{{setCount}}">
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<label for="calc-rate" style="display: flex; justify-content: space-between; align-items: baseline; font-weight: 700"><span>原価率</span><span style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 26px">{{rate}}<span style="font-size: 14px">%</span></span></label>
<input id="calc-rate" type="range" min="10" max="60" step="5" value="{{rate}}" onChange="{{setRate}}">
</div>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-weight: 700; margin-bottom: 8px">出店する枠（時間によって人件費が変わります）</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{slotOpts}}" as="o"><button type="button" onClick="{{o.pick}}" style="flex: 1 1 200px; min-height: 48px; padding: 8px 14px; border-radius: 12px; border: 2px solid {{o.border}}; background: {{o.bg}}; color: #1B2626; font: inherit; font-weight: 700; cursor: pointer; text-align: left">{{o.label}}</button></sc-for>
</div>
</fieldset>
<div style="border-top: 1px dashed #D9DED8; padding-top: 16px; display: flex; flex-direction: column; gap: 14px">

<sc-if value="{{detail}}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 2px"><label for="calc-wage" style="display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 14px"><span>時給（ご自身の分も）</span><span>{{wageLabel}}円 × {{hours}}時間</span></label><input id="calc-wage" type="range" min="0" max="2000" step="100" value="{{wage}}" onChange="{{setWage}}"><span style="font-size: 12px; color: #4A5856">作業時間は、選んだ枠の時間に設営・撤収の2時間を足して計算しています</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><label for="calc-pack" style="display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 14px"><span>包装資材（1人あたり）</span><span>{{pack}}円</span></label><input id="calc-pack" type="range" min="0" max="100" step="10" value="{{pack}}" onChange="{{setPack}}"></div>
<div style="display: flex; flex-direction: column; gap: 2px"><label for="calc-card" style="display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 14px"><span>決済手数料</span><span>{{card}}%</span></label><input id="calc-card" type="range" min="0" max="5" step="1" value="{{card}}" onChange="{{setCard}}"><span style="font-size: 12px; color: #4A5856">現金だけなら0%</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><label for="calc-travel" style="display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 14px"><span>交通費・駐車代</span><span>{{travelLabel}}円</span></label><input id="calc-travel" type="range" min="0" max="3000" step="500" value="{{travel}}" onChange="{{setTravel}}"></div>
</div>
</sc-if>
</div>

<div style="width: {{costPct}}%; background: #9AA6A3"></div>
<div style="width: {{feePct}}%; background: #1B2626"></div>
<div style="width: {{otherPct}}%; background: #6E8C86"></div>
<div style="width: {{profitPct}}%; background: #B5541A"></div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: #4A5856">
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #9AA6A3"></span>原価</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #1B2626"></span>出店料 {{feeLabel}}円（キャンペーン価格）</span>
<sc-if value="{{detail}}"><span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #6E8C86"></span>その他の経費 {{otherLabel}}円</span></sc-if>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #B5541A"></span>{{profitShort}}</span>
</div>
</div>
</div>
<div style="flex: 1 1 300px; background: #B5541A; color: #FFFFFF; border-radius: 20px; padding: 32px 28px; display: flex; flex-direction: column; gap: 18px; justify-content: center">
<div>
<div style="font-size: 15px; font-weight: 700; color: #FFE3D2">{{profitTitle}}</div>
<div style="font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: 60px; line-height: 1.1">{{profit}}<span style="font-size: 22px">円</span></div>
</div>
<div style="border-top: 1px solid #D98A5C; padding-top: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 14px; color: #FFE3D2">{{beLabel}}</span><strong style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 26px">{{breakEven}}人目</strong></div>
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 14px; color: #FFE3D2">手元に5,000円残すには</span><strong style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 26px">{{target}}人</strong></div>
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 14px; color: #FFE3D2">場所代の比率</span><strong style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 26px">{{feeRatio}}%</strong></div>
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 14px; color: #FFE3D2">毎週1回、月4回出たら</span><strong style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 26px">{{profit4}}円</strong></div>
</div>
</div>
</div>
<p style="margin: 0; font-size: 12px; color: #4A5856">※出店料はキャンペーン価格で計算しています。計算例で、売上を保証するものではありません。最初の表示は、人件費（ご自身の分も）・包装資材・決済手数料・交通費まで引いた額です。「簡単な計算に戻す」を押すと、売上−原価−出店料だけで計算します。売れ残りや設備の償却費は含みません。参考：南草津駅の1日平均乗車人員26,860人の0.1%で約27人。</p>
</details>
</section>

<section id="traffic" style="max-width: 1120px; margin: 0 auto; padding: 48px 24px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 14px; font-weight: 700; color: {{accent}}; letter-spacing: 0.08em">3つの出店エリア</div>
<h2 style="margin: 0; font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: clamp(28px, 3.6vw, 40px); line-height: 1.35">西口・東口・駅構内。客に合わせて選べます。</h2>
<p style="margin: 0; max-width: 780px; color: #4A5856">南草津駅は1日平均26,860人が乗車する駅です（2023年度）。同じ駅でも、出口ごとに通る人と時間帯が違います。あなたの商品に合う場所を選んでください。3か所とも、最初の開催から出店できる予定です（開催日・区画は関係機関の承認後に確定）。1日あたり最大21店舗が並ぶ規模です。</p>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 14px; font-weight: 700; color: {{accent}}; letter-spacing: 0.08em">数字で見る南草津駅</div>
<p style="margin: -8px 0 0; font-size: 12px; color: #4A5856">数字は公表データで、年度を併記しています。時間帯ごとの人の流れと客層は、それらをもとにした運営者の推定です。</p>

<section id="guarantee" style="background: #1B2626; color: #FFFFFF">

<h2 style="margin: 0; font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: clamp(28px, 3.6vw, 40px); line-height: 1.35">初回売上1万円未満なら、<br>次回の1枠が無料。</h2>
<p style="margin: 0; max-width: 780px; color: #E4EAE8"><strong style="color: #FFFFFF">赤字を補てんする保証ではなく、もう一度挑戦できるようにする仕組みです。</strong>売上1万円以上でも、人件費などを含めると赤字になることがあります（目安は「利益の計算」で確認できます）。最初の開催日から2か月以内（2027年2月末まで）に、南草津で初めて出店する方が対象です。判定は売上の数字だけで行います。無料で出られる日時と受け入れ数は、開催条件が決まった時点でこのページに載せます。</p>

<div style="display: flex; align-items: center; gap: 10px"><span style="width: 36px; height: 36px; border-radius: 10px; background: #E3EFEB; color: #0D6B5E; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4l6 8 6-8M12 12v8M8 13h8M8 17h8"></path></svg></span><span style="font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: 18px">お金のこと</span></div>
<ul style="margin: 0; padding-left: 20px; font-size: 14px; color: #4A5856"><li style="margin: 0 0 6px">出店料は1枠3,300円（5時間）、土日祝の通し（西口・東口、8時間）・駅構内（5時間）と駅構内の金曜朝夕セットは5,500円（税込・2027年2月末までのキャンペーン価格）。売上歩合・保証金・登録料なし。</li><li style="margin: 0 0 6px">優先案内登録（無料）→ 日程確定後に受付順で決済リンク → 決済の完了で確定。</li><li style="margin: 0 0 6px">キャンセルは7日前まで全額返金（日程変更1回も可）、6日前〜2日前は50%、前日・当日は返金なし。</li><li style="margin: 0 0 6px">運営・市等の都合や荒天での中止は、全額返金または振替（2か月有効）。</li><li style="margin: 0 0 6px">初回の再挑戦サポート：最初の開催日から2か月以内（2027年2月末まで）に初めて出店し、売上（集計画面の写真つき）を期限内に報告して1万円未満（5,500円の枠は1万8千円未満）なら、2回目は運営者が案内する空き枠で無料（1人1回・2027年2月末まで）。紹介した仲間が初回決済したら次回半額。定期出店は売上実績の順に案内。</li><li style="margin: 0 0 6px">規約違反による中止・退場の場合、出店料は返金しません。</li></ul>
</div>
<div style="flex: 1 1 300px; background: #FFFFFF; border: 1px solid #D9DED8; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 36px; height: 36px; border-radius: 10px; background: #E3EFEB; color: #0D6B5E; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path></svg></span><span style="font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: 18px">安全のこと</span></div>
<ul style="margin: 0; padding-left: 20px; font-size: 14px; color: #4A5856"><li style="margin: 0 0 6px">草津市内で有効な営業許可・食品衛生責任者・賠償責任保険が条件。</li><li style="margin: 0 0 6px">裸火・ガスは事前申請と承認が必要。駅構内は火気不可。</li><li style="margin: 0 0 6px">酒類の販売は、必要な免許と承認がある場合のみ。</li><li style="margin: 0 0 6px">発電機は低騒音型で事前承認制（周辺は住宅地です）。</li><li style="margin: 0 0 6px">緊急時は通報を最優先し、そのあと運営スタッフとLINEに報告。</li></ul>

<div style="flex: 1 1 300px; background: #FFFFFF; border: 1px solid #D9DED8; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 10px">

<ul style="margin: 0; padding-left: 20px; font-size: 14px; color: #4A5856"><li style="margin: 0 0 6px">設営は枠の60分前から。撤収・清掃・原状回復は終了後45分以内に。</li><li style="margin: 0 0 6px">テントは1店舗あたり2.5m×2.5m〜3m×3m（駅構内のブースは約2.1m×2.1m）。区画からはみ出さない。</li><li style="margin: 0 0 6px">消火栓・火災受信所・設備の制御盤・看板の前をふさがない。</li><li style="margin: 0 0 6px">区画の外、点字ブロック、バス・タクシー乗降場に物や車を置かない。</li><li style="margin: 0 0 6px">東口は路線バスの運行が最優先。誘導員の指示に従う。</li><li style="margin: 0 0 6px">ゴミ・廃油は全量持ち帰り。ペグ打ち・貼り付けは禁止。</li><li style="margin: 0 0 6px">同じ枠の同業は、主力商品をもとに運営が調整します。</li></ul>

<div style="display: flex; flex-direction: column; padding-bottom: 16px">
<div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第1条（定義）</span><span style="color: #4A5856">売り場（西口・東口・駅構内）、枠、出店日、市等の定義</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第2条（会場・利用時間）</span><span style="color: #4A5856">金・土・日・祝。設営は枠の60分前から、撤収は終了後45分以内。東口はバス優先、駅構内はブースのみ・火気不可</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第3条（出店できる方）</span><span style="color: #4A5856">草津市内で有効な営業許可、食品衛生責任者、賠償責任保険、反社でないこと</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第4条（取扱商品）</span><span style="color: #4A5856">西口・東口は飲食テイクアウト、駅構内は包装済み食品・物販。酒類は免許と承認が必要。同業は調整</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第5条（食品衛生）</span><span style="color: #4A5856">許可の維持と衛生管理は出店者の責任。飲食物に起因する事故は出店者が負う</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第6条（保険）</span><span style="color: #4A5856">賠償責任保険への加入が必須</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第7条（公共空間の保全）</span><span style="color: #4A5856">占用許可の条件に従う。破損・汚損は原状回復か実費負担</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第8条（火気・電気・給排水）</span><span style="color: #4A5856">火気は事前承認。電源は指定容量内。発電機は低騒音型・承認制。油や残渣は流さない</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第9条（設営・什器）</span><span style="color: #4A5856">テントは2.5m×2.5m〜3m×3mで区画内に設置。ペグ打ち禁止（重りで固定）。時間外の残置禁止</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第10条（当日の運営と報告）</span><span style="color: #4A5856">受付へ到着報告。設営・撤収完了時に区画写真をLINEへ。緊急時は通報優先</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第11条（搬入・車両）</span><span style="color: #4A5856">指定の経路・時間で徐行。路上駐停車、バス・タクシー乗降場への停車は禁止</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第12条（ゴミ・清掃・近隣）</span><span style="color: #4A5856">ゴミは全量持ち帰り。煙・匂い・騒音に配慮。過度な客引き禁止</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第13条（出店料・支払い）</span><span style="color: #4A5856">1枠3,300円、土日祝の通し（西口・東口）・駅構内と駅構内の金曜朝夕セットは5,500円（税込）のキャンペーン価格。日程確定後に受付順で決済、完了で確定</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第14条（売上等の報告）</span><span style="color: #4A5856">終了後24時間以内に報告。統計の形で社会実験の報告に利用。店名つき公開は同意時のみ</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第15条（キャンセル・返金）</span><span style="color: #4A5856">7日前まで全額、6日前〜2日前50%、前日・当日なし。荒天中止は返金か振替</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第16条（中止・退場）</span><span style="color: #4A5856">違反や危険行為があれば中止・退場。出店料は返金なし</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第17条（反社会的勢力の排除）</span><span style="color: #4A5856">該当した場合は催告なく出店拒否</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第18条（個人情報）</span><span style="color: #4A5856">プライバシーポリシーに従う。許可証画像は資格確認にのみ使用</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第19条（責任・免責）</span><span style="color: #4A5856">営業に起因する事項は出店者の責任。運営者は募集・調整の範囲で責任を負う</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第20条〜第22条（変更・準拠法・管轄）</span><span style="color: #4A5856">規約の変更方法、日本法、大津地方裁判所</span></div>

<script>

function copyText(id, comp){
  var el=document.getElementById(id); if(!el) return;
  var txt=el.textContent;
  var done=function(){ comp.setState({copied:true}); };
  var fallback=function(){ try{ var r=document.createRange(); r.selectNodeContents(el); var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);}catch(e){} };
  try{ navigator.clipboard.writeText(txt).then(done, fallback); }catch(e){ fallback(); }
}
class DCLogic{ constructor(props){ this.props=props||{}; this.state={}; } setState(p){ Object.assign(this.state,p); scheduleRender(); } }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { slot: 1, price: 700, count: 40, rate: 30, monthIdx: 0, sel: null, chosen: null, picked: null, reserved: null, booked: {}, gA: false, gB: false, gC: false, kind: 'tent', submitted: false, rvError: false, afError: false, rvMsg: '', afMsg: '', copied: false, detail: true, wage: 1200, pack: 30, card: 3, travel: 1000 };
  }
  renderVals() {
    var s = this.state;
    var self = this;
    var SL = [
      { label: '駅構内・金曜の朝か夕方（5時間）', h: 5, fee: 3300 },
      { label: '西口・東口の通常枠（5時間）', h: 5, fee: 3300 },
      { label: '駅構内・金曜の朝と夕の両方（5時間×2）', h: 10, prep: 3, fee: 5500 },
      { label: '駅構内・土日祝（5時間）', h: 5, fee: 5500 },
      { label: '土日祝の通し（西口・東口、8時間）', h: 8, fee: 5500 }
    ];
    var cur = SL[s.slot] || SL[1];
    var fee = cur.fee;
    var slotOpts = SL.map(function (x, i) {
      var on = i === s.slot;
      return { label: x.label + '　' + x.fee.toLocaleString('ja-JP') + '円', border: on ? '#B5541A' : '#D9DED8', bg: on ? '#FFF4EC' : '#FFFFFF',
        pick: function () { self.setState({ slot: i }); } };
    });
    var sales = s.price * s.count;
    var cost = Math.round(sales * s.rate / 100);
    var hours = cur.h + (cur.prep || 2);
    var other = s.detail ? s.wage * hours + s.pack * s.count + Math.round(sales * s.card / 100) + s.travel : 0;
    var profit = sales - cost - fee - other;
    var margin = s.price * (1 - s.rate / 100) - (s.detail ? s.pack + s.price * s.card / 100 : 0);
    var fixed = fee + (s.detail ? s.wage * hours + s.travel : 0);
    var be = margin > 0 ? Math.floor(fixed / margin) + 1 : '—';
    var target = margin > 0 ? Math.ceil((fixed + 5000) / margin) : '—';
    var fmt = function (n) { return (n < 0 ? '▲' : '') + Math.abs(n).toLocaleString('ja-JP'); };
    var total = Math.max(sales, cost + fee + other);

    var months = [[2026, 11], [2026, 12], [2027, 1], [2027, 2]];
    var hol = { '2026-11-03': '文化の日', '2026-11-23': '勤労感謝', '2027-01-11': '成人の日', '2027-02-11': '建国記念', '2027-02-23': '天皇誕生' };
    var closed = { '2026-12-31': 1, '2027-01-01': 1, '2027-01-02': 1, '2027-01-03': 1 };
    var W = { area: '西口・公園前', color: '#0D6B5E', kind: 'テント・キッチンカー・最大3店舗・電源あり', cap: 3 };
    var E = { area: '東口・駅前広場', color: '#1F4E79', kind: 'テント・キッチンカー・最大13店舗', cap: 13 };
    var C = { area: '駅構内・自由通路', color: '#B5541A', kind: 'ブース出店・5ブース（約2.1m四方）', cap: 5 };
    var mk = function (base, time, price) { return { area: base.area, color: base.color, kind: base.kind, cap: base.cap, time: time, price: price || '3,300円' }; };
    var rules = function (dow, isHol) {
      if (dow === 5) return [mk(W, '15:00〜20:00'), mk(E, '15:30〜20:30'), mk(C, '7:00〜12:00'), mk(C, '15:00〜20:00'), mk(C, '朝と夕の両方（7:00〜12:00・15:00〜20:00）', '5,500円')];
      if (dow === 6 || dow === 0 || isHol) return [mk(W, '11:00〜16:00'), mk(W, '10:00〜18:00（通し）', '5,500円'), mk(E, '10:00〜15:00'), mk(E, '16:00〜21:00'), mk(E, '11:00〜19:00（通し）', '5,500円'), mk(C, '10:00〜15:00', '5,500円')];
      return [];
    };
    var wd = ['日', '月', '火', '水', '木', '金', '土'];
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    var ym = months[s.monthIdx];
    var y = ym[0], m = ym[1];
    var first = new Date(y, m - 1, 1);
    var lead = (first.getDay() + 6) % 7;
    var days = new Date(y, m, 0).getDate();
    var cells = [];
    for (var i = 0; i < lead; i++) cells.push({ isOpen: false, isPlain: true, day: '', note: '', bg: 'transparent' });
    for (var d = 1; d <= days; d++) {
      var key = y + '-' + pad(m) + '-' + pad(d);
      var dow = new Date(y, m - 1, d).getDay();
      var isHol = !!hol[key];
      var sl = closed[key] ? [] : rules(dow, isHol);
      if (sl.length) {
        var seen = {}; var dots = [];
        sl.forEach(function (x) { if (!seen[x.color]) { seen[x.color] = 1; dots.push({ color: x.color }); } });
        var isSel = s.sel === key;
        cells.push({ isOpen: true, isPlain: false, day: d, hol: isHol ? '祝' : '', dots: dots,
          bg: isSel ? '#FFF4EC' : '#FFFFFF', border: isSel ? '#B5541A' : '#D9DED8',
          aria: m + '月' + d + '日 開催候補日',
          pick: (function (k) { return function () { self.setState({ sel: k, picked: null, reserved: null }); }; })(key) });
      } else {
        var isClosed = !!closed[key] || (isHol && false);
        cells.push({ isOpen: false, isPlain: true, day: d, note: closed[key] ? '休' : '', bg: closed[key] ? '#E8EBE6' : 'transparent' });
      }
    }
    var slots = [];
    var selLabel = '';
    if (s.sel) {
      var p2 = s.sel.split('-');
      var dd = new Date(+p2[0], +p2[1] - 1, +p2[2]);
      selLabel = (+p2[1]) + '月' + (+p2[2]) + '日（' + wd[dd.getDay()] + (hol[s.sel] ? '・祝' : '') + '）';
      slots = rules(dd.getDay(), !!hol[s.sel]).map(function (x) {
        var lbl = selLabel + ' ' + x.area + ' ' + x.time + '（' + x.price + '）';
        var left = Math.max(0, x.cap - ((s.booked || {})[lbl] || 0));
        return { area: x.area, time: x.time, color: x.color, kind: x.kind, price: x.price, left: left,
          pick: function () { self.setState({ picked: lbl, chosen: lbl, kind: x.area.indexOf('駅構内') === 0 ? 'booth' : self.state.kind }); } };
      });
    }
    var gateOpen = s.gA && s.gB && s.gC;
    return {
      accent: this.props.accent ?? '#0D6B5E',
      price: s.price,
      priceLabel: s.price.toLocaleString('ja-JP'),
      count: s.count,
      rate: s.rate,
      sales: sales.toLocaleString('ja-JP'),
      profit: fmt(profit),
      profit4: fmt(profit * 4),
      breakEven: be,
      target: target,
      feeLabel: fee.toLocaleString('ja-JP'),
      slotOpts: slotOpts,
      feeRatio: sales > 0 ? (fee / sales * 100).toFixed(1) : '-',
      costPct: (cost / total * 100).toFixed(1),
      feePct: (fee / total * 100).toFixed(1),
      profitPct: (Math.max(profit, 0) / total * 100).toFixed(1),
      otherPct: (other / total * 100).toFixed(1),
      otherLabel: other.toLocaleString('ja-JP'),
      detail: s.detail,
      detailBtn: s.detail ? '簡単な計算に戻す' : 'その他の経費も引いて計算する',
      detailBg: s.detail ? '#0D6B5E' : '#FFFFFF',
      detailFg: s.detail ? '#FFFFFF' : '#0D6B5E',
      toggleDetail: function () { self.setState({ detail: !self.state.detail }); },
      profitTitle: s.detail ? '経費を引いた実質の利益' : '粗利から出店料を引いた額',
      profitShort: s.detail ? '実質の利益' : '粗利−出店料',
      beLabel: s.detail ? '経費まで元が取れるのは' : '出店料の元が取れるのは',
      hours: hours,
      wage: s.wage, wageLabel: s.wage.toLocaleString('ja-JP'), pack: s.pack, card: s.card, travel: s.travel, travelLabel: s.travel.toLocaleString('ja-JP'),
      setWage: function (e) { self.setState({ wage: Number(e.target.value) }); },
      setPack: function (e) { self.setState({ pack: Number(e.target.value) }); },
      setCard: function (e) { self.setState({ card: Number(e.target.value) }); },
      setTravel: function (e) { self.setState({ travel: Number(e.target.value) }); },
      setPrice: function (e) { self.setState({ price: Number(e.target.value) }); },
      setCount: function (e) { self.setState({ count: Number(e.target.value) }); },
      setRate: function (e) { self.setState({ rate: Number(e.target.value) }); },
      monthLabel: y + '年' + m + '月',
      prevMonth: function () { self.setState({ monthIdx: Math.max(0, self.state.monthIdx - 1) }); },
      nextMonth: function () { self.setState({ monthIdx: Math.min(months.length - 1, self.state.monthIdx + 1) }); },
      cells: cells,
      hasSel: !!s.sel,
      noSel: !s.sel && !s.picked && !s.reserved,
      showSlots: !!s.sel && !s.picked && !s.reserved,
      showForm: !!s.picked && !s.reserved,
      reservedOn: !!s.reserved,
      pickLabel: s.picked || '',
      reservedLabel: s.reserved || '',
      repick: function () { self.setState({ picked: null }); },
      reserve: function () {
        var v = function (id) { var el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; };
        var name = v('rv-name');
        if (!name) { self.setState({ rvError: true }); return; }
        var msg = '【南草津駅前 出店の仮予約】\n希望の枠：' + self.state.picked + '\n屋号：' + name + '\n連絡先：' + (v('rv-contact') || 'このLINE') + '\n売るもの：' + (v('rv-goods') || '未記入') + '\n営業許可：' + v('rv-permit');
        self.setState({ reserved: self.state.picked, rvMsg: msg, rvError: false, copied: false });
      },
      rvError: s.rvError, afError: s.afError,
      rvMsg: s.rvMsg, afMsg: s.afMsg,
      rvLine: 'https://line.me/R/oaMessage/%40907kxssd/?' + encodeURIComponent(s.rvMsg || ''),
      copyLabel: s.copied ? 'コピーしました' : '内容をコピー',
      copyRv: function () { copyText('rv-msg', self); },
      copyAf: function () { copyText('af-msg', self); },
      again: function () { self.setState({ sel: null, picked: null, reserved: null, copied: false }); },
      selDateLabel: selLabel,
      slots: slots,
      chosenLabel: s.chosen || '未定（希望日が決まっていなくても登録できます）',
      toggleA: function (e) { self.setState({ gA: e.target.checked }); },
      toggleB: function (e) { self.setState({ gB: e.target.checked }); },
      toggleC: function (e) { self.setState({ gC: e.target.checked }); },
      gateOpen: gateOpen,
      gateClosed: !gateOpen,
      setKind: function (e) { self.setState({ kind: e.target.value }); },
      kindVal: s.kind,
      isKc: s.kind === 'kc',
      submitLabel: 'メールで送る内容をつくる',
      submit: function () {
        var v = function (id) { var el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; };
        if (!v('af-name') || !v('af-email') || !v('af-goods')) { self.setState({ afError: true, submitted: false }); return; }
        var kindEl = document.getElementById('af-kind');
        var kindTxt = kindEl && kindEl.selectedIndex >= 0 ? kindEl.options[kindEl.selectedIndex].text : '';
        var msg = '【南草津駅前 出店の優先案内登録】\n希望の枠：' + (self.state.chosen || '未定') + '\n屋号：' + v('af-name') + '\nメール：' + v('af-email') + '\n主力商品：' + v('af-goods') + '\n出店形態：' + kindTxt + '\n営業許可：' + v('af-permit') + '\n希望の曜日：' + v('af-dow') + '\n紹介者：' + (v('af-ref') || 'なし');
        self.setState({ submitted: true, afError: false, afMsg: msg, copied: false });
      },
      submitted: s.submitted
    };
  }
}

(function(){
var tpl=document.getElementById('lp-tpl');
var root=document.getElementById('lp-root');
var comp=new Component({accent:'#0D6B5E'});
window.__comp=comp;
var H={}, hid=0;
var fnCache={};
function ev(expr,scope){ expr=expr.trim(); var f=fnCache[expr]||(fnCache[expr]=new Function('s','with(s){return ('+expr+');}')); try{return f(scope);}catch(e){return undefined;} }
function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
var RX=/\{\{([^}]*)\}\}/g;
function interp(str,scope){ return str.replace(RX,function(_,e){ return esc(ev(e,scope)); }); }
var VOID={AREA:1,BR:1,COL:1,EMBED:1,HR:1,IMG:1,INPUT:1,LINK:1,META:1,SOURCE:1,TRACK:1,WBR:1};
function kids(n,scope){ var o=''; for(var c=n.firstChild;c;c=c.nextSibling) o+=node(c,scope); return o; }
function node(n,scope){
  if(n.nodeType===3) return n.nodeValue.indexOf('{{')<0? esc(n.nodeValue).replace(/&quot;/g,'"') : interp(n.nodeValue,scope);
  if(n.nodeType!==1) return '';
  var tag=n.tagName;
  if(tag==='SC-FOR'){ var list=ev(n.getAttribute('list').replace(/^\{\{|\}\}$/g,''),scope)||[]; var as=n.getAttribute('as')||'item'; var o=''; for(var i=0;i<list.length;i++){ var sc=Object.create(scope); sc[as]=list[i]; o+=kids(n,sc);} return o; }
  if(tag==='SC-IF'){ return ev(n.getAttribute('value').replace(/^\{\{|\}\}$/g,''),scope)? kids(n,scope):''; }
  var t=tag.toLowerCase(), o='<'+t;
  for(var i=0;i<n.attributes.length;i++){ var a=n.attributes[i], nm=a.name, val=a.value;
    if(nm.slice(0,2)==='on' && /^\s*\{\{[^}]*\}\}\s*$/.test(val)){ var fn=ev(val.trim().slice(2,-2),scope); if(typeof fn==='function'){ var id='h'+(hid++); H[id]=fn; o+=' data-on-'+nm.slice(2)+'="'+id+'"'; } continue; }
    if(val.indexOf('{{')>=0){ var m=val.match(/^\s*\{\{([^}]*)\}\}\s*$/); if(m){ var r=ev(m[1],scope); if(r===false||r==null) continue; if(r===true){ o+=' '+nm; continue;} o+=' '+nm+'="'+esc(r)+'"'; continue;} val=interp(val,scope); o+=' '+nm+'="'+val+'"'; continue; }
    o+=' '+nm+'="'+esc(val)+'"';
  }
  o+='>';
  if(VOID[tag]) return o;
  var src = tag==='TEMPLATE'? n.content : n;
  return o+kids(src,scope)+'</'+t+'>';

function build(){ H={}; hid=0; var vals=comp.renderVals(); return '<div id="lp-root">'+kids(tpl.content,vals)+'</div>'; }
var pending=false;
window.scheduleRender=function(){ if(pending) return; pending=true; requestAnimationFrame(function(){ pending=false; render(); }); };
function render(){
  var html=build();
  morphdom(root, html, { onBeforeElUpdated:function(from,to){
    if(from.tagName==='DETAILS' && from.open) to.setAttribute('open','');
    if(from.tagName==='SELECT') { return false; }
    if(from.tagName==='INPUT' && (from.type==='text'||from.type==='email')) { return false; }
    return true; } });
}
root.innerHTML=build().replace(/^<div id="lp-root">|<\/div>$/g,'');
function fire(kind,e){ var el=e.target.closest? e.target.closest('[data-on-'+kind+']'):null; if(!el) return; var fn=H[el.getAttribute('data-on-'+kind)]; if(fn) fn(e); }
root.addEventListener('click',function(e){ fire('click',e); });
root.addEventListener('input',function(e){ if(e.target.type==='range') fire('change',e); });
root.addEventListener('change',function(e){ if(e.target.type!=='range') fire('change',e); });
})();
</script>
