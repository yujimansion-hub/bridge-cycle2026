<div style="display: flex; flex-wrap: wrap; gap: 8px"><div style="padding: 6px 14px; border-radius: 999px; background: #0D6B5E; font-size: 14px; font-weight: 700">JR南草津駅 西口・東口・駅構内</div><div style="padding: 6px 14px; border-radius: 999px; background: #B5541A; font-size: 14px; font-weight: 700">受付開始前（準備中）</div></div>
<h1 style="margin: 0; font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: clamp(38px, 6vw, 68px); line-height: 1.25"><span style="display: block; font-size: 0.42em; line-height: 1.5; color: #9FD3C7; margin-bottom: 8px">いつもの店の外でも。お店を持たなくても。</span>南草津駅前で、<br>売ってみる。</h1>
<p style="margin: 0; max-width: 560px; color: #E4EAE8">既存の飲食店も、キッチンカーも、これから開業する方も。新しいお客さんに商品を試せる、駅前の販売チャレンジです。</p>
<p style="margin: 0; max-width: 560px; font-size: 19px; font-weight: 700; color: #FFFFFF">初回売上1万円未満なら、次回の1枠が無料。<br><span style="display: block; margin-top: 6px; font-size: 13px; line-height: 1.6; font-weight: 500; color: #E4EAE8">指定の空き枠・期限内の売上報告など条件あり。優先案内登録は、開催場所・日時が確定してから受付を始めます。</span></p>
<div style="display: flex; flex-wrap: wrap; gap: 12px; max-width: 640px">
<div style="position: relative; flex: 1 1 160px; background: #FFFFFF; color: #1B2626; border-radius: 16px; padding: 16px 20px">
<div style="position: absolute; top: -12px; left: 16px; padding: 2px 10px; border-radius: 999px; background: #B5541A; color: #FFFFFF; font-size: 12px; font-weight: 700">キャンペーン価格</div>
<div style="font-size: 13px; color: #4A5856">出店料</div>
<div style="font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: 34px; line-height: 1.2">3,300<span style="font-size: 15px">円／回（税込）</span></div>
<div style="font-size: 12px; color: #4A5856">1枠（売り場により2〜5時間）。土曜・西口の通し枠（8時間）は5,500円</div>
</div>
<div style="flex: 1 1 160px; background: #FFFFFF; color: #1B2626; border-radius: 16px; padding: 16px 20px">

<div style="flex: 1 1 160px; background: #FFFFFF; color: #1B2626; border-radius: 16px; padding: 16px 20px">

<p style="margin: 0; font-size: 12px; color: #9DB0AC">JR南草津駅の1日平均乗車人員は26,860人（2023年度）です。駅の利用者全員が出店場所の前を通るわけではありません。出店場所ごとの通行量は、開催前に実測して公開します。出店料は社会実験期間中（2027年2月まで）のキャンペーン価格・税込です。飲食テイクアウト専用。写真はイメージです。営業許可・食品衛生責任者・賠償責任保険が必要です。</p>

<span style="font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: 28px; color: #FFFFFF">7人目</span><span style="font-size: 13px; color: #E4EAE8">で出店料の元が取れる計算（客単価700円・原価率30%。人件費などは含みません）</span>

<section id="calc" style="max-width: 1120px; margin: 0 auto; padding: 88px 24px 48px; display: flex; flex-direction: column; gap: 28px">

<div style="font-size: 14px; font-weight: 700; color: {{accent}}; letter-spacing: 0.08em">01 利益シミュレーター</div>
<h2 style="margin: 0; font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: clamp(28px, 3.6vw, 40px); line-height: 1.35">あなたの商品で、1回いくら残るか。</h2>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px">
<div style="flex: 999 1 440px; min-width: 0; background: #FFFFFF; border: 1px solid #D9DED8; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 2px">
<label for="calc-price" style="display: flex; justify-content: space-between; align-items: baseline; font-weight: 700"><span>客単価</span><span style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 26px">{{priceLabel}}<span style="font-size: 14px">円</span></span></label>
<input id="calc-price" type="range" min="300" max="2000" step="50" value="{{price}}" onChange="{{setPrice}}">
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<label for="calc-count" style="display: flex; justify-content: space-between; align-items: baseline; font-weight: 700"><span>来客数</span><span style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 26px">{{count}}<span style="font-size: 14px">人</span></span></label>
<input id="calc-count" type="range" min="5" max="150" step="5" value="{{count}}" onChange="{{setCount}}">
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<label for="calc-rate" style="display: flex; justify-content: space-between; align-items: baseline; font-weight: 700"><span>原価率</span><span style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 26px">{{rate}}<span style="font-size: 14px">%</span></span></label>
<input id="calc-rate" type="range" min="10" max="60" step="5" value="{{rate}}" onChange="{{setRate}}">
</div>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-weight: 700; margin-bottom: 8px">枠の種類</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{pickShort}}" style="flex: 1 1 200px; min-height: 48px; padding: 8px 14px; border-radius: 12px; border: 2px solid {{shortBorder}}; background: {{shortBg}}; color: #1B2626; font: inherit; font-weight: 700; cursor: pointer; text-align: left">1枠（2〜5時間）　3,300円</button>
<button type="button" onClick="{{pickLong}}" style="flex: 1 1 200px; min-height: 48px; padding: 8px 14px; border-radius: 12px; border: 2px solid {{longBorder}}; background: {{longBg}}; color: #1B2626; font: inherit; font-weight: 700; cursor: pointer; text-align: left">土曜・西口の通し枠（8時間）　5,500円</button>
</div>
</fieldset>
<div style="border-top: 1px dashed #D9DED8; padding-top: 16px; display: flex; flex-direction: column; gap: 14px">
<button type="button" onClick="{{toggleDetail}}" style="align-self: flex-start; min-height: 44px; padding: 6px 18px; border-radius: 999px; border: 2px solid #0D6B5E; background: {{detailBg}}; color: {{detailFg}}; font: inherit; font-weight: 700; cursor: pointer">{{detailBtn}}</button>
<sc-if value="{{detail}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 2px"><label for="calc-wage" style="display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 14px"><span>時給（ご自身の分も）</span><span>{{wageLabel}}円 × {{hours}}時間</span></label><input id="calc-wage" type="range" min="0" max="2000" step="100" value="{{wage}}" onChange="{{setWage}}"><span style="font-size: 12px; color: #4A5856">作業時間は、4時間の枠に準備・片付けの1時間を足して計算しています（通し枠は8時間＋1時間）</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><label for="calc-pack" style="display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 14px"><span>包装資材（1人あたり）</span><span>{{pack}}円</span></label><input id="calc-pack" type="range" min="0" max="100" step="10" value="{{pack}}" onChange="{{setPack}}"></div>
<div style="display: flex; flex-direction: column; gap: 2px"><label for="calc-card" style="display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 14px"><span>決済手数料</span><span>{{card}}%</span></label><input id="calc-card" type="range" min="0" max="5" step="1" value="{{card}}" onChange="{{setCard}}"><span style="font-size: 12px; color: #4A5856">現金だけなら0%</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><label for="calc-travel" style="display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 14px"><span>交通費・駐車代</span><span>{{travelLabel}}円</span></label><input id="calc-travel" type="range" min="0" max="3000" step="500" value="{{travel}}" onChange="{{setTravel}}"></div>
</div>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 700; color: #4A5856">売上 {{sales}}円 の内訳</div>
<div style="display: flex; height: 36px; border-radius: 10px; overflow: hidden; background: #E8EBE6">
<div style="width: {{costPct}}%; background: #9AA6A3"></div>
<div style="width: {{feePct}}%; background: #1B2626"></div>
<div style="width: {{otherPct}}%; background: #6E8C86"></div>
<div style="width: {{profitPct}}%; background: #B5541A"></div>
</div>

<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #9AA6A3"></span>原価</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #1B2626"></span>出店料 {{feeLabel}}円（キャンペーン価格）</span>
<sc-if value="{{detail}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #6E8C86"></span>その他の経費 {{otherLabel}}円</span></sc-if>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #B5541A"></span>{{profitShort}}</span>
</div>
</div>
</div>
<div style="flex: 1 1 300px; background: #B5541A; color: #FFFFFF; border-radius: 20px; padding: 32px 28px; display: flex; flex-direction: column; gap: 18px; justify-content: center">
<div>
<div style="font-size: 15px; font-weight: 700; color: #FFE3D2">{{profitTitle}}</div>
<div style="font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: 60px; line-height: 1.1">{{profit}}<span style="font-size: 22px">円</span></div>
</div>
<div style="border-top: 1px solid #D98A5C; padding-top: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 14px; color: #FFE3D2">{{beLabel}}</span><strong style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 26px">{{breakEven}}人目</strong></div>
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 14px; color: #FFE3D2">場所代の比率</span><strong style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 26px">{{feeRatio}}%</strong></div>
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 14px; color: #FFE3D2">毎週1回、月4回出たら</span><strong style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 26px">{{profit4}}円</strong></div>
</div>
</div>
</div>
<p style="margin: 0; font-size: 12px; color: #4A5856">※出店料はキャンペーン価格で計算しています。計算例で、売上を保証するものではありません。最初の表示は「売上−原価−出店料」で、人件費などは含みません。「その他の経費も引いて計算する」を押すと、人件費・包装資材・決済手数料・交通費も引けます。売れ残りや設備の償却費は含みません。参考：南草津駅の1日平均乗車人員26,860人の0.1%で約27人。</p>
</section>

<div style="display: flex; flex-direction: column; gap: 6px">

<p style="margin: 0; max-width: 780px; color: #4A5856">南草津駅は1日平均26,860人が乗車する駅です（2023年度）。同じ駅でも、出口ごとに通る人と時間帯が違います。あなたの商品に合う場所を選んでください。東口・駅構内は、ほかの社会実験チームと調整中です。</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div style="flex: 1 1 300px; background: #FFFFFF; border: 1px solid #D9DED8; border-top: 8px solid #0D6B5E; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px"><span style="font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: 30px; color: #0D6B5E">1</span><span style="font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: 22px">西口・公園前</span></div>
<div style="display: flex; flex-direction: column; gap: 8px; font-size: 14px">
<div><div style="font-size: 12px; font-weight: 700; color: #4A5856">通る人</div><div>駅から住宅地へ帰る人、駅前マンションの住民、公園で過ごす家族</div></div>
<div><div style="font-size: 12px; font-weight: 700; color: #4A5856">売れそうなもの</div><div>持ち帰りの夕食・惣菜・おつまみ／軽食・ドリンク・おやつ</div></div>
<div><div style="font-size: 12px; font-weight: 700; color: #4A5856">想定する販売時間帯</div><div>金曜の夕方、土曜の昼（10〜18時の通し枠もあり）</div></div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><span style="padding: 4px 12px; border-radius: 999px; background: #E3EFEB; color: #1B2626; font-size: 13px; font-weight: 700">キッチンカー</span><span style="padding: 4px 12px; border-radius: 999px; background: #E3EFEB; color: #1B2626; font-size: 13px; font-weight: 700">テント</span></div>

<p style="margin: 0; max-width: 780px; color: #E4EAE8">2026年12月末までに、南草津で初めて出店する方全員が対象です。人数の上限はありません。判定は売上の数字だけで、自動で行います。</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><div style="flex: 1 1 220px; border: 1px solid #5E8F86; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px"><div style="font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: 28px; color: #9FD3C7; line-height: 1">1</div><div style="font-weight: 700">出店する</div><div style="font-size: 14px; color: #D7ECE6">初めての出店を、2026年12月末までの開催日で。</div></div><div style="flex: 1 1 220px; border: 1px solid #5E8F86; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px"><div style="font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: 28px; color: #9FD3C7; line-height: 1">2</div><div style="font-weight: 700">24時間以内に売上を報告</div><div style="font-size: 14px; color: #D7ECE6">売上報告フォームに入力し、決済アプリやレジの「1日の集計画面」の写真を添えます。</div></div><div style="flex: 1 1 220px; border: 1px solid #5E8F86; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px"><div style="font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: 28px; color: #9FD3C7; line-height: 1">3</div><div style="font-weight: 700">基準未満なら、無料クーポンが届く</div><div style="font-size: 14px; color: #D7ECE6">売上が1万円未満（通し枠は1万8千円未満）なら、2回目の無料クーポンを自動でお送りします。</div></div></div>
<div style="max-width: 780px; border: 1px solid #5E8F86; border-radius: 12px; padding: 12px 16px; font-size: 13px; color: #D7ECE6; display: flex; flex-direction: column; gap: 4px"><div style="font-weight: 700; color: #FFFFFF">保証の条件</div><div>・売上報告を期限内に行い、集計画面の写真を添えること（現金だけの方は、レジの記録か売上メモの写真）</div><div>・無料で出られるのは、運営者がご案内する空き枠です（土曜・西口の通し枠は対象外）</div><div>・お一人1回まで。クーポンは2027年2月末までの出店に使えます</div></div>
<div style="font-size: 14px; font-weight: 700; color: #9FD3C7; letter-spacing: 0.08em; margin-top: 8px">出店した方全員に</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><div style="flex: 1 1 240px; background: #FFFFFF; color: #1B2626; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px"><div style="font-weight: 700">会場平均と比べたレポート</div><div style="font-size: 14px; color: #4A5856">売上を報告すると、同じ枠の会場平均と比べた数字と次回のヒントがメールで届きます。</div></div><div style="flex: 1 1 240px; background: #FFFFFF; color: #1B2626; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px"><div style="font-weight: 700">屋号とメニューを紹介</div><div style="font-size: 14px; color: #4A5856">ご希望の方は、このページとSNSで出店者としてお店を紹介します。</div></div><div style="flex: 1 1 240px; background: #FFFFFF; color: #1B2626; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px"><div style="font-weight: 700">仲間を紹介すると、次回半額</div><div style="font-size: 14px; color: #4A5856">紹介した出店仲間が初回の決済を済ませたら、あなたの次回の出店料を半額にします（1回の出店につき1回まで）。</div></div><div style="flex: 1 1 240px; background: #FFFFFF; color: #1B2626; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px"><div style="font-weight: 700">定期出店のご案内</div><div style="font-size: 14px; color: #4A5856">2回以上出店した方に、同じ曜日・同じ場所に毎週出られる定期出店を、売上実績の順にご案内します。</div></div></div>
<div><a href="#schedule" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; border-radius: 999px; background: #B5541A; color: #FFFFFF; font-weight: 700; text-decoration: none">開催候補日を見る</a></div>
</div>
</section>

<section id="schedule" style="max-width: 1120px; margin: 0 auto; padding: 48px 24px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 14px; font-weight: 700; color: {{accent}}; letter-spacing: 0.08em">04 開催候補日</div>
<h2 style="margin: 0; font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: clamp(28px, 3.6vw, 40px); line-height: 1.35">希望する日と枠を選ぶ。</h2>
<p style="margin: 0; max-width: 780px; color: #4A5856">金曜と土曜を開催候補日にしています。開催日は、UDCみなくさ・関係機関との調整が済みしだい確定します。日付をタップすると、その日の候補の売り場と時間帯が出ます。<strong>枠を選ぶと、下の登録フォームに入ります。希望日が決まっていない方は、選ばずに登録できます。いま払う必要はありません。</strong></p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 999 1 520px; min-width: 0; background: #FFFFFF; border: 1px solid #D9DED8; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<button type="button" onClick="{{prevMonth}}" aria-label="前の月" style="min-width: 44px; min-height: 44px; border-radius: 999px; border: 1px solid #D9DED8; background: #FFFFFF; color: #1B2626; font: inherit; font-weight: 700; cursor: pointer">‹</button>
<div style="font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: 22px">{{monthLabel}}</div>
<button type="button" onClick="{{nextMonth}}" aria-label="次の月" style="min-width: 44px; min-height: 44px; border-radius: 999px; border: 1px solid #D9DED8; background: #FFFFFF; color: #1B2626; font: inherit; font-weight: 700; cursor: pointer">›</button>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; font-size: 12px; font-weight: 700; color: #4A5856">
<div>月</div><div>火</div><div>水</div><div>木</div><div style="color: #B5541A">金</div><div style="color: #1F4E79">土</div><div style="color: #B5541A">日</div>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
<sc-if value="{{c.isOpen}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{c.pick}}" aria-label="{{c.aria}}" style="min-height: 64px; padding: 6px 2px; border-radius: 10px; border: 2px solid {{c.border}}; background: {{c.bg}}; color: #1B2626; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px">
<span style="font-weight: 700; font-size: 15px">{{c.day}}</span>
<span style="font-size: 10px; color: #B5541A; font-weight: 700">{{c.hol}}</span>
<span style="display: flex; gap: 3px">
<sc-for list="{{c.dots}}" as="d" hint-placeholder-count="2"><span style="width: 8px; height: 8px; border-radius: 999px; background: {{d.color}}"></span></sc-for>
</span>
</button>
</sc-if>
<sc-if value="{{c.isPlain}}" hint-placeholder-val="{{ true }}">
<div style="min-height: 64px; padding: 6px 2px; border-radius: 10px; background: {{c.bg}}; color: #9AA6A3; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px"><span>{{c.day}}</span><span style="font-size: 10px; font-weight: 700">{{c.note}}</span></div>
</sc-if>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: #4A5856">
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 999px; background: #0D6B5E"></span>西口</span><span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 999px; background: #1F4E79"></span>東口</span><span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 999px; background: #B5541A"></span>駅構内</span><span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #E8EBE6"></span>受付不可日</span>
</div>
</div>
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<sc-if value="{{hasSel}}" hint-placeholder-val="{{ false }}">
<div style="font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: 20px">{{selDateLabel}}の空き枠</div>
<sc-for list="{{slots}}" as="t" hint-placeholder-count="3">
<div style="background: #FFFFFF; border: 1px solid #D9DED8; border-left: 6px solid {{t.color}}; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline"><strong>{{t.area}}</strong><span style="font-size: 13px; color: #4A5856">{{t.time}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 13px"><span style="color: #4A5856"><strong style="color: #1B2626">{{t.price}}</strong>｜{{t.kind}}｜定員{{t.left}}組（予定）</span>
<a href="#apply-form" onClick="{{t.choose}}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; background: #B5541A; color: #FFFFFF; font-weight: 700; text-decoration: none">この枠を希望として控える</a></div>
</div>
</sc-for>
</sc-if>
<sc-if value="{{noSel}}" hint-placeholder-val="{{ true }}">
<div style="background: #E3EFEB; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; color: #2F4A45">
<div style="font-weight: 700; font-size: 16px; color: #1B2626">日付をタップしてください</div>
<div>金：西口・東口（夕方）、駅構内（朝・夕方）</div>
<div>土：西口（昼、または10〜18時の通し）、東口（夕方）、駅構内（昼）</div>
<div style="font-size: 13px">日曜・祝日は、出店状況を見て追加します。</div>
</div>
</sc-if>
</div>
</div>
<p style="margin: 0; font-size: 12px; color: #4A5856">※開催日・時間は案です。UDCみなくさとの確定後、優先案内登録の受付順に決済のご案内をお送りし、決済の完了で予約が確定します。日程が変わった場合は、変更後の日程でご案内するか、キャンセル扱い（費用なし）とします。</p>
</section>

<h2 style="margin: 0; font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: clamp(28px, 3.6vw, 40px); line-height: 1.35">3つそろえば、出られます。</h2>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px">

<div style="flex: 1 1 240px; background: #FFFFFF; border: 1px solid #D9DED8; border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 14px">
<div style="flex: 0 0 40px; height: 40px; border-radius: 999px; background: #E3EFEB; color: #0D6B5E; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></div>

</div>

<p style="margin: 0; font-size: 15px; color: #5C3415"><strong>大津市で出店している方へ：</strong>草津市は滋賀県（草津保健所）の管轄です。大津市の許可だけでは営業できない場合があるので、お申し込み前に一緒に確認します（無料）。</p>

</section>

<section id="dayflow" style="max-width: 1120px; margin: 0 auto; padding: 48px 24px; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; flex-wrap: wrap; gap: 24px">

<div style="flex: 1 1 auto; width: 2px; background: #D9DED8"></div>
</div>
<div style="flex: 1 1 auto; background: #FFFFFF; border: 1px solid #D9DED8; border-radius: 16px; padding: 16px 18px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px">
<div style="font-weight: 700; font-size: 16px">開催判断とリマインドが届く</div>
<div style="font-size: 14px; color: #4A5856">LINEで、開催の可否・当日の区画・搬入口をお知らせします。雨天中止の場合も、ここでご連絡します。</div>
</div>
</div>

<div style="display: flex; gap: 16px; align-items: stretch">
<div style="flex: 0 0 96px; display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="padding: 4px 10px; border-radius: 999px; background: #0D6B5E; color: #FFFFFF; font-size: 12px; font-weight: 700; white-space: nowrap">15:30</div>
<div style="flex: 1 1 auto; width: 2px; background: #D9DED8"></div>
</div>
<div style="flex: 1 1 auto; background: #FFFFFF; border: 1px solid #D9DED8; border-radius: 16px; padding: 16px 18px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px">
<div style="font-weight: 700; font-size: 16px">到着・受付して、設営開始</div>
<div style="font-size: 14px; color: #4A5856">枠の30分前から設営できます［UDCと調整中］。会場の運営スタッフ（受付）に到着を伝え、キッチンカーは誘導員の案内で、歩行者に気をつけて区画に入ります。受付はUDCみなくさが担当します（詳細はUDC事務局と調整中）。</div>
</div>

<div style="display: flex; gap: 16px; align-items: stretch">

</div>

<div style="font-size: 14px; color: #4A5856">枠の時間をまるごと販売に使えます。設営が終わったら、区画の写真を1枚LINEで送ってください（出店の記録のためです）。</div>

</div>

<div style="display: flex; gap: 16px; align-items: stretch">

<div style="font-size: 14px; font-weight: 700; color: {{accent}}; letter-spacing: 0.08em">07 出店のルール</div>
<h2 style="margin: 0; font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: clamp(28px, 3.6vw, 40px); line-height: 1.35">気持ちよく続けるための、約束ごと。</h2>
<p style="margin: 0; max-width: 780px; color: #4A5856">公共の場所での出店です。出店者・利用者・まちの三方がよくなるように、次のルールで運営します。詳しくは出店規約をご確認ください。</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div style="flex: 1 1 300px; background: #FFFFFF; border: 1px solid #D9DED8; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 36px; height: 36px; border-radius: 10px; background: #E3EFEB; color: #0D6B5E; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4l6 8 6-8M12 12v8M8 13h8M8 17h8"></path></svg></span><span style="font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: 18px">お金のこと</span></div>
<ul style="margin: 0; padding-left: 20px; font-size: 14px; color: #4A5856"><li style="margin: 0 0 6px">出店料は1枠3,300円（売り場により2〜5時間）、土曜・西口の通し枠（8時間）5,500円（税込・2027年2月末までのキャンペーン価格）。売上歩合・保証金・登録料なし。</li><li style="margin: 0 0 6px">優先案内登録（無料）→ 日程確定後に受付順で決済リンク → 決済の完了で確定。</li><li style="margin: 0 0 6px">キャンセルは7日前まで全額返金（日程変更1回も可）、6日前〜2日前は50%、前日・当日は返金なし。</li><li style="margin: 0 0 6px">運営・市等の都合や荒天での中止は、全額返金または振替（2か月有効）。</li><li style="margin: 0 0 6px">初回保証：2026年12月末までに初めて出店し、売上（集計画面の写真つき）を期限内に報告して1万円未満（通し枠1万8千円未満）なら、2回目は運営者が案内する空き枠で無料（1人1回・2027年2月末まで）。紹介した仲間が初回決済したら次回半額。定期出店は売上実績の順に案内。</li><li style="margin: 0 0 6px">規約違反による中止・退場の場合、出店料は返金しません。</li></ul>
</div>
<div style="flex: 1 1 300px; background: #FFFFFF; border: 1px solid #D9DED8; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 36px; height: 36px; border-radius: 10px; background: #E3EFEB; color: #0D6B5E; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path></svg></span><span style="font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: 18px">安全のこと</span></div>
<ul style="margin: 0; padding-left: 20px; font-size: 14px; color: #4A5856"><li style="margin: 0 0 6px">草津市内で有効な営業許可・食品衛生責任者・賠償責任保険が条件。</li><li style="margin: 0 0 6px">裸火・ガスは事前申請と承認が必要。駅構内は火気不可。</li><li style="margin: 0 0 6px">酒類の販売は、必要な免許と承認がある場合のみ。</li><li style="margin: 0 0 6px">発電機は低騒音型で事前承認制（周辺は住宅地です）。</li><li style="margin: 0 0 6px">緊急時は通報を最優先し、そのあと運営スタッフとLINEに報告。</li></ul>
</div>
<div style="flex: 1 1 300px; background: #FFFFFF; border: 1px solid #D9DED8; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 36px; height: 36px; border-radius: 10px; background: #E3EFEB; color: #0D6B5E; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg></span><span style="font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: 18px">場所の使い方</span></div>
<ul style="margin: 0; padding-left: 20px; font-size: 14px; color: #4A5856"><li style="margin: 0 0 6px">設営は枠の30分前から。撤収・清掃・原状回復は終了後30分以内に。</li><li style="margin: 0 0 6px">区画の外、点字ブロック、バス・タクシー乗降場に物や車を置かない。</li><li style="margin: 0 0 6px">東口は路線バスの運行が最優先。誘導員の指示に従う。</li><li style="margin: 0 0 6px">ゴミ・廃油は全量持ち帰り。ペグ打ち・貼り付けは禁止。</li><li style="margin: 0 0 6px">同じ枠の同業は、主力商品をもとに運営が調整します。</li></ul>
</div>

<details id="kiyaku" style="background: #FFFFFF; border: 1px solid #D9DED8; border-radius: 16px; padding: 4px 20px">
<summary style="min-height: 52px; display: flex; align-items: center; font-weight: 700; cursor: pointer">出店規約（南草津版）の要点を開く（全22条）</summary>
<div style="display: flex; flex-direction: column; padding-bottom: 16px">
<div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第1条（定義）</span><span style="color: #4A5856">売り場（西口・東口・駅構内）、枠、出店日、市等の定義</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第2条（会場・利用時間）</span><span style="color: #4A5856">まず金・土（日・祝は追加時に告知）。設営は枠の30分前から、撤収は終了後30分以内。東口はバス優先、駅構内はブースのみ・火気不可</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第3条（出店できる方）</span><span style="color: #4A5856">草津市内で有効な営業許可、食品衛生責任者、賠償責任保険、反社でないこと</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第4条（取扱商品）</span><span style="color: #4A5856">西口・東口は飲食テイクアウト、駅構内は包装済み食品・物販。酒類は免許と承認が必要。同業は調整</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第5条（食品衛生）</span><span style="color: #4A5856">許可の維持と衛生管理は出店者の責任。飲食物に起因する事故は出店者が負う</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第6条（保険）</span><span style="color: #4A5856">賠償責任保険への加入が必須</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第7条（公共空間の保全）</span><span style="color: #4A5856">占用許可の条件に従う。破損・汚損は原状回復か実費負担</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第8条（火気・電気・給排水）</span><span style="color: #4A5856">火気は事前承認。電源は指定容量内。発電機は低騒音型・承認制。油や残渣は流さない</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第9条（設営・什器）</span><span style="color: #4A5856">区画内に設置。ペグ打ち禁止。時間外の残置禁止</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第10条（当日の運営と報告）</span><span style="color: #4A5856">受付へ到着報告。設営・撤収完了時に区画写真をLINEへ。緊急時は通報優先</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第11条（搬入・車両）</span><span style="color: #4A5856">指定の経路・時間で徐行。路上駐停車、バス・タクシー乗降場への停車は禁止</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第12条（ゴミ・清掃・近隣）</span><span style="color: #4A5856">ゴミは全量持ち帰り。煙・匂い・騒音に配慮。過度な客引き禁止</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第13条（出店料・支払い）</span><span style="color: #4A5856">1枠3,300円・土曜西口の通し枠5,500円（税込）のキャンペーン価格。日程確定後に受付順で決済、完了で確定</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第14条（売上等の報告）</span><span style="color: #4A5856">終了後24時間以内に報告。統計の形で社会実験の報告に利用。店名つき公開は同意時のみ</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第15条（キャンセル・返金）</span><span style="color: #4A5856">7日前まで全額、6日前〜2日前50%、前日・当日なし。荒天中止は返金か振替</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第16条（中止・退場）</span><span style="color: #4A5856">違反や危険行為があれば中止・退場。出店料は返金なし</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第17条（反社会的勢力の排除）</span><span style="color: #4A5856">該当した場合は催告なく出店拒否</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第18条（個人情報）</span><span style="color: #4A5856">プライバシーポリシーに従う。許可証画像は資格確認にのみ使用</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第19条（責任・免責）</span><span style="color: #4A5856">営業に起因する事項は出店者の責任。運営者は募集・調整の範囲で責任を負う</span></div><div style="display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #E8EBE6; font-size: 14px"><span style="flex: 0 0 120px; font-weight: 700">第20条〜第22条（変更・準拠法・管轄）</span><span style="color: #4A5856">規約の変更方法、日本法、大津地方裁判所</span></div>
<p style="margin: 12px 0 0; font-size: 12px; color: #4A5856">お申し込みの前に、規約の全文をご確認ください。［全文ページ：公開時にリンク］</p>
