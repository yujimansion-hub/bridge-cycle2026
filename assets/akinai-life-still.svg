<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">これからを考える、静かな朝のテーブル</title>
<desc id="desc">やわらかな朝の光の中、開いたノート、ペン、マグカップ、眼鏡、植物が置かれた暮らしの一場面</desc>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fffaf6"/>
    <stop offset=".62" stop-color="#f6ece5"/>
    <stop offset="1" stop-color="#e9ddd4"/>
  </linearGradient>
  <linearGradient id="table" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ead8ca"/>
    <stop offset=".55" stop-color="#e5d0c0"/>
    <stop offset="1" stop-color="#d6bdab"/>
  </linearGradient>
  <radialGradient id="sun" cx=".22" cy=".22" r=".72">
    <stop offset="0" stop-color="#fff" stop-opacity=".96"/>
    <stop offset=".42" stop-color="#fff6e8" stop-opacity=".62"/>
    <stop offset="1" stop-color="#fff6e8" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#705548" flood-opacity=".18"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
</defs>

<rect width="1200" height="760" fill="url(#wall)"/>
<rect width="1200" height="760" fill="url(#sun)"/>

<!-- window -->
<g opacity=".62">
  <rect x="0" y="0" width="390" height="420" fill="#fffdf8"/>
  <rect x="182" y="0" width="8" height="420" fill="#e5d7cd"/>
  <rect x="0" y="214" width="390" height="8" fill="#e5d7cd"/>
  <path d="M28 377 C84 300 93 216 143 148 C171 110 214 89 278 84" fill="none" stroke="#c7d0bc" stroke-width="18" stroke-linecap="round" opacity=".32"/>
  <circle cx="115" cy="264" r="28" fill="#aab99f" opacity=".24"/>
  <circle cx="165" cy="180" r="32" fill="#aab99f" opacity=".21"/>
  <circle cx="248" cy="118" r="35" fill="#aab99f" opacity=".18"/>
</g>

<!-- soft wall picture -->
<g opacity=".52" filter="url(#soft)">
  <rect x="555" y="75" width="150" height="118" rx="12" fill="#c9b0a2"/>
  <rect x="736" y="116" width="118" height="92" rx="10" fill="#b7c0ad"/>
</g>

<!-- table -->
<path d="M0 476 C220 450 408 466 606 456 C833 445 1005 447 1200 468 L1200 760 L0 760 Z" fill="url(#table)"/>
<path d="M0 486 C270 462 480 477 690 465 C904 453 1058 458 1200 475" fill="none" stroke="#c8ad9a" stroke-width="2" opacity=".65"/>

<!-- notebook -->
<g filter="url(#shadow)">
  <path d="M356 491 Q510 454 635 486 L625 682 Q496 649 356 679 Z" fill="#fffdf9"/>
  <path d="M625 486 Q770 449 914 490 L924 679 Q782 649 625 682 Z" fill="#fffdf9"/>
  <path d="M625 487 L625 682" stroke="#d6c8be" stroke-width="3"/>
  <g stroke="#e7ddd6" stroke-width="2" opacity=".8">
    <path d="M392 535 L581 505"/><path d="M389 570 L578 540"/><path d="M386 605 L575 575"/><path d="M383 640 L572 610"/>
    <path d="M670 512 L869 535"/><path d="M667 548 L872 570"/><path d="M664 584 L875 605"/><path d="M661 620 L878 640"/>
  </g>
  <path d="M416 523 C474 503 527 501 558 508" fill="none" stroke="#c98276" stroke-width="5" stroke-linecap="round" opacity=".68"/>
  <circle cx="846" cy="616" r="25" fill="#edf0e8"/>
  <path d="M836 620 C839 600 850 592 861 586 M848 607 C841 598 834 595 827 595 M850 601 C857 592 865 590 872 591" fill="none" stroke="#809474" stroke-width="4" stroke-linecap="round"/>
</g>

<!-- pen -->
<g transform="rotate(-11 694 515)" filter="url(#shadow)">
  <rect x="688" y="470" width="14" height="168" rx="7" fill="#5c514a"/>
  <rect x="688" y="470" width="14" height="32" rx="7" fill="#c98276"/>
  <path d="M688 638 L695 656 L702 638 Z" fill="#b7967e"/>
</g>

<!-- mug -->
<g filter="url(#shadow)">
  <ellipse cx="1018" cy="554" rx="77" ry="24" fill="#d1b6a5" opacity=".35"/>
  <path d="M953 474 Q1020 457 1068 480 L1060 602 Q1014 622 964 600 Z" fill="#f6f1ea"/>
  <ellipse cx="1010" cy="481" rx="58" ry="17" fill="#e6ddd4"/>
  <ellipse cx="1010" cy="482" rx="49" ry="12" fill="#8a6f60"/>
  <path d="M1060 505 C1122 490 1139 535 1110 564 C1098 576 1081 576 1063 568" fill="none" stroke="#f6f1ea" stroke-width="18" stroke-linecap="round"/>
  <path d="M991 445 C978 422 1005 410 995 385 M1023 447 C1011 421 1039 408 1027 379" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".55"/>
</g>

<!-- glasses -->
<g transform="translate(190 588) rotate(8)" stroke="#6a5a51" stroke-width="7" fill="none" stroke-linecap="round" opacity=".82">
  <ellipse cx="0" cy="0" rx="54" ry="38"/>
  <ellipse cx="124" cy="0" rx="54" ry="38"/>
  <path d="M54 0 C74 -11 103 -11 110 0"/>
  <path d="M-50 -15 L-96 -48"/>
  <path d="M174 -15 L220 -48"/>
</g>

<!-- plant -->
<g transform="translate(1020 150)">
  <path d="M74 266 C58 190 69 112 55 38" fill="none" stroke="#71856a" stroke-width="8" stroke-linecap="round"/>
  <path d="M65 208 C12 184 4 149 14 125 C45 125 72 148 74 180" fill="#9cab8f"/>
  <path d="M62 153 C101 123 122 87 112 58 C83 62 60 92 59 124" fill="#7f9577"/>
  <path d="M57 105 C28 89 22 63 30 45 C55 48 69 66 68 87" fill="#a7b79d"/>
  <path d="M72 257 C107 228 134 202 132 173 C101 170 75 191 67 221" fill="#899e80"/>
  <path d="M23 270 L132 270 L120 360 Q77 382 35 360 Z" fill="#e5d6cb"/>
  <ellipse cx="77" cy="271" rx="55" ry="14" fill="#d5c1b3"/>
</g>

<!-- tiny personal detail: ring tray -->
<g filter="url(#shadow)" opacity=".92">
  <ellipse cx="256" cy="496" rx="58" ry="17" fill="#f6eee7"/>
  <ellipse cx="256" cy="494" rx="46" ry="11" fill="#eadbd0"/>
  <circle cx="254" cy="489" r="12" fill="none" stroke="#c9a774" stroke-width="4"/>
</g>

<!-- foreground light -->
<ellipse cx="310" cy="500" rx="300" ry="230" fill="#fff8ed" opacity=".16"/>
</svg>