name: Audit corrected homepage layout
on:
  push:
    branches: [fix/home-layout-qa-20261103]
    paths: ['.github/workflows/home-layout-qa.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-layout-qa-20261103
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          which google-chrome || which chromium || true
          mkdir -p /tmp/home-qa
          npm --prefix /tmp/home-qa install --no-audit --no-fund playwright-core@1.56.0
      - name: Capture corrected local desktop and mobile layouts
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/home-server.log 2>&1 &
          sleep 2
          QA_URL=http://127.0.0.1:8765/ NODE_PATH=/tmp/home-qa/node_modules node scripts/home-layout-qa.cjs
      - name: Commit QA geometry and screenshots
        run: |
          git config user.name "BRIDGE CYCLE QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/home-layout-geometry.json qa/*.b64 qa/*_full.jpg
          git commit -m "Inspect live layout across five viewports" || true
          git push origin HEAD:fix/home-layout-qa-20261103
