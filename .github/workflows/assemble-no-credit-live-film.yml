name: Assemble no-credit live film
on:
  push:
    branches: [film/no-credit-live-action-20261103]
    paths: ['.github/workflows/assemble-no-credit-live-film.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: film/no-credit-live-action-20261103
          persist-credentials: true
      - name: Install free local editing and font tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python3 -m pip install numpy Pillow --quiet --break-system-packages
      - name: Re-edit previously owned live-action-style videos
        run: python3 scripts/assemble_liveaction_film.py
      - name: Publish the new no-credit film and contact sheet
        run: |
          git config user.name "BRIDGE CYCLE Film Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/BRIDGE_CYCLE_concept_liveaction_30s.mp4 film_preview/final_contact.b64 film_preview/render_meta.json
          git commit -m "Produce 30-second no-credit live-action concept film" || true
          git push origin HEAD:film/no-credit-live-action-20261103
